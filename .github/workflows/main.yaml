name: main
on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  merge_group:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
            build: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
            build: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
            build: 'sudo apt-get install -yqqq musl-tools'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            build: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
            build: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            build: ''
    steps:
      - uses: actions/checkout@main
      - name: Cache
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: build
        run: |
          ${{ matrix.build }}
          rustup target add ${{ matrix.target }}
          cargo test --workspace --target ${{ matrix.target }}
          cargo build --target ${{ matrix.target }} --release --workspace
      - name: Archive release artifacts bin
        uses: actions/upload-artifact@main
        with:
          name: mod_installer-${{ matrix.target }}${{ matrix.suffix }}
          path: ./target/${{ matrix.target }}/release/mod_installer${{ matrix.suffix }}
          if-no-files-found: error
  build-nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: nixbuild/nix-quick-install-action@master
      - name: cache
        uses: nix-community/cache-nix-action@main
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - run: nix build
      - name: Archive release artifacts
        uses: actions/upload-artifact@main
        with:
          name: mod_installer-nix
          path: ./result/bin/mod_installer
          if-no-files-found: error
  trigger-release:
    needs: [build, build-nix]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: trigger
        run: |
          gh workflow run release.yaml --ref ${{ github.ref_name }} -f run_id=${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
